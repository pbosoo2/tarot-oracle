name: Save Tarot Directly to Notion
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Base64 encoded tarot reading
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tarot-save
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save reading to Notion
        run: node scripts/save-reading.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          READING_PAYLOAD_B64: ${{ inputs.payload }}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>별빛 타로 리딩</title>
<style>
:root{--bg:#0d0b18;--panel:#171329;--panel2:#201a38;--text:#f7f2ff;--muted:#b8adc9;--gold:#e5c478;--purple:#8b6fc7;--line:#352d4f;--ok:#71c9a1;--danger:#e68383}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#35235b 0,#151027 38%,var(--bg) 75%);color:var(--text);font-family:Inter,"Noto Sans KR",Arial,sans-serif;min-height:100vh}.app{max-width:1120px;margin:auto;padding:28px 24px 64px}.hero{text-align:center;padding:20px 0 24px}.eyebrow{color:var(--gold);letter-spacing:.18em;font-size:13px}.hero h1{font-family:Georgia,serif;font-size:clamp(32px,6vw,58px);margin:8px 0}.hero p{color:var(--muted);margin:0}.steps{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px 0}.step{border:1px solid var(--line);padding:8px 12px;border-radius:8px;color:var(--muted);font-size:14px}.step.active{border-color:var(--gold);color:var(--gold);background:#2b2340}.panel{background:rgba(23,19,41,.94);border:1px solid var(--line);border-radius:14px;padding:22px;margin:16px 0}.panel h2{font:700 22px Georgia,serif;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode-btn{min-height:92px;padding:16px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);cursor:pointer}.mode-btn strong{display:block;font-size:16px;margin-bottom:7px}.mode-btn span{color:var(--muted);font-size:13px;line-height:1.5}.mode-btn.selected{border-color:var(--gold);background:#2b2340;box-shadow:inset 0 0 0 1px rgba(229,196,120,.18)}.spread{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;min-height:92px}.spread:hover,.spread.selected{border-color:var(--gold);transform:translateY(-1px)}.spread strong{display:block;color:#fff;font-size:16px;margin-bottom:6px}.spread span{font-size:13px;color:var(--muted)}label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}input,textarea,select{width:100%;background:#100d1c;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:12px;font:inherit}textarea{resize:vertical;min-height:82px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.count{color:var(--gold);font-weight:700}.deck{display:grid;grid-template-columns:repeat(13,1fr);gap:7px;max-height:300px;overflow:auto;padding:4px}.cardback{aspect-ratio:2/3;min-width:48px;border:1px solid #7d68a8;border-radius:7px;background:linear-gradient(135deg,#251c42,#594285);position:relative;cursor:pointer;box-shadow:inset 0 0 0 3px #1c1630}.cardback:after{content:"✦";position:absolute;inset:20%;display:grid;place-items:center;border:1px solid #d9bd73;color:#e8d59b;border-radius:50%;font-size:18px}.cardback:hover{border-color:var(--gold);transform:translateY(-3px)}.cardback.used{opacity:.12;pointer-events:none}.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}.slot{border:1px dashed #5a4d78;border-radius:10px;min-height:180px;padding:10px;text-align:center;color:var(--muted)}.slot.filled{border-style:solid;border-color:var(--gold);background:#211a36}.mini-card{height:106px;width:72px;margin:0 auto 8px;border:1px solid var(--gold);border-radius:7px;background:linear-gradient(#faf4df,#e7d8b4);color:#2d2440;display:grid;place-items:center;padding:7px;font:700 12px Georgia,serif;position:relative}.mini-card.rev{transform:rotate(180deg)}.position{font-size:13px;color:var(--gold)}.picked{font-size:12px;margin-top:4px}.manual-slot{text-align:left;min-height:210px}.manual-slot .position{display:block;margin-bottom:10px}.manual-slot label{margin-top:9px}.manual-slot select{padding:10px;font-size:14px}.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:8px;padding:11px 16px;background:#2a2342;color:#fff;cursor:pointer;font-weight:700}.btn.primary{background:var(--gold);border-color:var(--gold);color:#241b31}.btn:disabled{opacity:.4;cursor:not-allowed}.reading{display:none}.reading.show{display:block}.summary{font:21px/1.65 Georgia,serif;color:#fff;background:#201a38;border-left:3px solid var(--gold);padding:18px}.interpretation{display:grid;gap:12px}.interp{padding:16px;border:1px solid var(--line);border-radius:10px;background:#130f22}.interp h3{margin:0 0 8px;color:var(--gold);font-size:16px}.interp p{margin:0;color:#d8cfe5;line-height:1.75}.advice li{margin:8px 0;line-height:1.6}.savebar{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:18px}.notice{font-size:13px;color:var(--muted);margin-top:8px}.status{margin-top:10px;font-weight:700}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}.hidden{display:none}button{transition:transform .14s ease,box-shadow .14s ease,opacity .2s ease,background-color .2s ease}button.button-clicked{transform:translateY(1px) scale(.97);box-shadow:inset 0 0 0 2px rgba(229,196,120,.32)}.deck.shuffling{pointer-events:none;animation:deckShuffle .56s ease-in-out}@keyframes deckShuffle{0%{opacity:1}50%{opacity:.7}100%{opacity:1}}@media(max-width:760px){.app{padding:18px 16px 48px}.grid{grid-template-columns:1fr 1fr}.mode-grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.deck{grid-template-columns:repeat(7,1fr)}.savebar{grid-template-columns:1fr}.panel{padding:16px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.deck{grid-template-columns:repeat(5,1fr)}.hero h1{font-size:36px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body><main class="app">
<header class="hero"><div class="eyebrow">✦ THE STELLAR ORACLE ✦</div><h1>별빛 타로 리딩</h1><p>스프레드를 고르고, 마음이 닿는 카드 뒷면을 순서대로 선택하세요.</p></header>
<div class="steps"><span class="step active" id="s1">1. 방식·스프레드</span><span class="step" id="s2">2. 질문</span><span class="step" id="s3">3. 카드 선택</span><span class="step" id="s4">4. 해석</span></div>
<section class="panel"><h2>0. 카드 선택 방식</h2><div class="mode-grid"><button class="mode-btn selected" id="modeDigital"><strong>화면에서 직접 뽑기</strong><span>78장의 카드 뒷면 중 마음이 가는 카드를 클릭합니다.</span></button><button class="mode-btn" id="modeManual"><strong>실물 카드 입력</strong><span>현실에서 뽑은 카드와 정·역방향을 순서대로 입력합니다.</span></button></div></section>
<section class="panel"><h2>1. 스프레드 선택</h2><div class="grid" id="spreads"></div></section>
<section class="panel"><h2>2. 질문과 상황</h2><div class="fields"><div><label for="question">질문</label><textarea id="question" placeholder="예: 새로운 일을 시작해도 좋을까요?"></textarea></div><div><label for="situation">현재 상황 (선택)</label><textarea id="situation" placeholder="배경이나 현재 감정을 적으면 해석이 더 구체적이 됩니다."></textarea></div></div></section>
<section class="panel"><div class="toolbar"><h2 style="margin:0">3. 카드 선택</h2><div class="count" id="counter">스프레드를 먼저 선택하세요</div></div><div class="slots" id="slots"><div class="slot">스프레드를 선택하면 카드 자리가 열립니다.</div></div><div class="deck" id="deck"></div><div class="actions" style="margin-top:16px"><button class="btn" id="reset">다시 섞기</button><button class="btn primary" id="read" disabled>해석 보기</button></div></section>
<section class="panel reading" id="reading"><h2>4. 리딩 결과</h2><div class="summary" id="summary"></div><h2 style="margin-top:24px">상세 해석</h2><div class="interpretation" id="details"></div><h2 style="margin-top:24px">현실적인 조언</h2><ul class="advice" id="advice"></ul><div class="savebar"><div><label for="githubToken">GitHub PAT</label><input id="githubToken" type="password" autocomplete="off" placeholder="Fine-grained PAT · Actions 읽기 및 쓰기"><div class="notice">토큰은 현재 탭의 sessionStorage에만 임시 보관되며 HTML이나 GitHub 저장소에 기록되지 않습니다.</div></div><button class="btn primary" id="save">GitHub Action으로 저장</button></div><div class="status" id="status"></div></section>
</main>
<script>
const GITHUB_REPO='pbosoo2/tarot-oracle';
const GITHUB_WORKFLOW='save-tarot-direct.yml';
const spreads=[
{name:'원 카드',desc:'오늘의 메시지·빠른 통찰',pos:['핵심 메시지']},
{name:'3장 기본',desc:'과거·현재·미래의 흐름',pos:['과거','현재','미래']},
{name:'상황·장애물·조언',desc:'문제의 구조를 명확하게',pos:['현재 상황','장애물','조언']},
{name:'마음의 삼각형',desc:'생각·감정·행동',pos:['생각','감정','행동']},
{name:'선택의 길',desc:'A와 B의 흐름 비교',pos:['현재','선택 A','A의 결과','선택 B','B의 결과','결정의 열쇠']},
{name:'관계 리딩',desc:'나·상대·관계의 흐름',pos:['나의 마음','상대의 마음','관계의 현재','보이지 않는 요소','앞으로의 흐름','관계를 위한 조언']},
{name:'말발굽',desc:'7장으로 보는 다층적인 흐름',pos:['과거','현재','숨은 영향','장애물','주변 환경','최선의 행동','가능한 결과']},
{name:'차크라',desc:'일곱 에너지의 균형',pos:['뿌리','천골','태양신경총','심장','목','제3의 눈','왕관']},
{name:'5장 십자',desc:'상황을 입체적으로 점검',pos:['현재','과거의 영향','숨은 요소','조언','가능한 결과']},
{name:'켈틱 크로스',desc:'10장 심층 종합 리딩',pos:['현재','도전','의식','무의식','과거','가까운 미래','나의 태도','외부 환경','희망과 두려움','가능한 결과']},
{name:'월간 흐름',desc:'4주와 핵심 조언',pos:['1주차','2주차','3주차','4주차','이번 달 조언']},
{name:'한 해의 문',desc:'12개월의 장기 흐름',pos:['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월']}
];
const majors=[
['바보','새로운 시작, 자유, 순수한 용기','무모함, 준비 부족, 방향 잃음'],['마법사','의지, 실행력, 재능의 활용','집중력 분산, 기회 오용, 자신감 부족'],['여사제','직관, 내면의 지혜, 기다림','직관 외면, 비밀, 감정 억압'],['여황제','풍요, 창조성, 돌봄','과잉보호, 정체, 자기 돌봄 부족'],['황제','질서, 책임, 안정된 기반','경직, 통제 욕구, 권위와의 갈등'],['교황','전통, 배움, 조언과 가치관','관습 탈피, 독단, 맞지 않는 규칙'],['연인','조화, 선택, 가치의 일치','불균형, 망설임, 관계의 오해'],['전차','전진, 의지, 방향 통제','성급함, 방향 상실, 갈등'],['힘','용기, 인내, 부드러운 통제','자기 의심, 감정 소진, 억압'],['은둔자','성찰, 탐색, 내면의 등불','고립, 회피, 지나친 고민'],['운명의 수레바퀴','전환점, 순환, 뜻밖의 기회','지연, 반복되는 패턴, 변화 저항'],['정의','균형, 진실, 책임 있는 판단','불공정, 편견, 책임 회피'],['매달린 사람','관점 전환, 내려놓음, 유예','정체, 희생의식, 놓지 못함'],['죽음','마무리, 변환, 새 단계','변화 거부, 미련, 오래된 집착'],['절제','조율, 회복, 중용','불균형, 과도함, 속도 조절 필요'],['악마','욕망, 집착, 그림자 직면','속박에서 벗어남, 유혹 인식, 회복'],['탑','갑작스러운 깨달음, 구조의 붕괴, 진실','변화 회피, 불안, 작은 균열'],['별','희망, 치유, 영감','낙담, 신뢰 부족, 회복 지연'],['달','불확실성, 꿈, 무의식','혼란 해소, 진실 드러남, 두려움 완화'],['태양','기쁨, 명료함, 활력','일시적 지연, 과도한 낙관, 기쁨을 놓침'],['심판','각성, 결단, 과거의 통합','자기비판, 결단 지연, 배움 회피'],['세계','완성, 성취, 통합','미완성, 마무리 필요, 다음 단계 지연']
];
const suits={
'완드':['열정과 창조적 행동','에너지가 흩어지거나 추진력이 막힘'],
'컵':['감정과 관계의 흐름','감정의 혼선 또는 관계의 거리'],
'소드':['생각과 소통, 결단','과도한 생각 또는 날카로운 갈등'],
'펜타클':['현실, 자원, 일과 안정','현실적 지연 또는 자원 관리 문제']};
const ranks=[['에이스','새 씨앗과 가능성','기회의 지연이나 준비 부족'],['2','균형과 선택','망설임과 불균형'],['3','확장과 협력','협력의 어긋남'],['4','기반과 유지','경직과 정체'],['5','긴장과 시험','갈등 완화와 회복'],['6','조화와 이동','과거에 머무름'],['7','평가와 도전','확신 부족과 재점검'],['8','속도와 숙련','지연과 반복'],['9','성숙과 거의 다다름','피로와 경계심'],['10','완성과 부담','과부하와 책임 조정'],['시종','소식과 호기심','미숙함과 산만함'],['기사','추진과 탐험','충동과 속도 조절'],['여왕','내적 성숙과 수용','자기 돌봄 부족과 감정 과잉'],['왕','통솔과 완성된 역량','통제와 완고함']];
const deck=[...majors.map((m,i)=>({name:`${i} ${m[0]}`,up:m[1],rev:m[2],arc:'메이저 아르카나'}))];
Object.entries(suits).forEach(([s,sm])=>ranks.forEach(r=>deck.push({name:`${s} ${r[0]}`,up:`${sm[0]}, ${r[1]}`,rev:`${sm[1]}, ${r[2]}`,arc:`${s} 수트`})));
let selectedSpread=null, selected=[], shuffled=[], inputMode='digital', manualSelected=[]; const $=id=>document.getElementById(id);
function setMode(mode){inputMode=mode;selected=[];manualSelected=[];document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('selected'));$(mode==='digital'?'modeDigital':'modeManual').classList.add('selected');if(mode==='digital')shuffle();else{renderDeck();renderSlots();update()} }
function shuffle(){shuffled=[...deck].sort(()=>Math.random()-.5);selected=[];manualSelected=[];renderDeck();renderSlots();update();}
function reshuffle(){const deckEl=$('deck');deckEl.classList.remove('shuffling');void deckEl.offsetWidth;deckEl.classList.add('shuffling');$('reset').disabled=true;$('read').disabled=true;setTimeout(()=>{shuffle();},280);setTimeout(()=>{deckEl.classList.remove('shuffling');$('reset').disabled=false;update();},580);}
function handleReset(){if(inputMode==='digital'){reshuffle();return}selected=[];manualSelected=[];renderSlots();update();}
function renderSpreads(){ $('spreads').innerHTML=spreads.map((s,i)=>`<button class="spread" data-i="${i}"><strong>${s.name} · ${s.pos.length}장</strong><span>${s.desc}</span></button>`).join(''); document.querySelectorAll('.spread').forEach(b=>b.onclick=()=>{selectedSpread=spreads[+b.dataset.i];document.querySelectorAll('.spread').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=[];manualSelected=[];if(inputMode==='digital')shuffle();else{renderDeck();renderSlots();update()}$('s2').classList.add('active');$('s3').classList.add('active');});}
function renderDeck(){const deckEl=$('deck');const manual=inputMode==='manual';deckEl.classList.toggle('hidden',manual);$('reset').textContent=manual?'입력 초기화':'다시 섞기';if(manual){deckEl.innerHTML='';return}deckEl.innerHTML=shuffled.map((c,i)=>`<button class="cardback ${selected.some(x=>x.i===i)?'used':''}" data-i="${i}" aria-label="뒤집힌 타로 카드"></button>`).join('');document.querySelectorAll('.cardback').forEach(b=>b.onclick=()=>pick(+b.dataset.i));}
function pick(i){if(inputMode!=='digital'||!selectedSpread)return;if(selected.length>=selectedSpread.pos.length)return;if(selected.some(x=>x.i===i))return;selected.push({i,card:shuffled[i],rev:Math.random()<.5});renderDeck();renderSlots();update();}
function cardOptions(current){return `<option value="">카드를 선택하세요</option>`+deck.map(c=>`<option value="${c.name}" ${current===c.name?'selected':''}>${c.name}</option>`).join('')}
function manualPick(i){const name=$(`manualCard${i}`).value;const rev=$(`manualDir${i}`).value==='reversed';if(name&&manualSelected.some((x,j)=>j!==i&&x?.card.name===name)){$(`manualCard${i}`).value='';manualSelected[i]=null;selected=manualSelected.filter(Boolean);$('counter').textContent='같은 카드는 두 번 입력할 수 없습니다.';$('read').disabled=true;return}const card=deck.find(c=>c.name===name);manualSelected[i]=card?{i,card,rev}:null;selected=manualSelected.filter(Boolean);update();}
function renderSlots(){if(!selectedSpread){$('slots').innerHTML='<div class="slot">스프레드를 선택하면 카드 자리가 열립니다.</div>';return}if(inputMode==='manual'){$('slots').innerHTML=selectedSpread.pos.map((p,i)=>{const x=manualSelected[i];return `<div class="slot manual-slot ${x?'filled':''}"><span class="position">${i+1}. ${p}</span><label for="manualCard${i}">실물 카드</label><select id="manualCard${i}" onchange="manualPick(${i})">${cardOptions(x?.card.name||'')}</select><label for="manualDir${i}">방향</label><select id="manualDir${i}" onchange="manualPick(${i})"><option value="upright" ${!x?.rev?'selected':''}>정방향</option><option value="reversed" ${x?.rev?'selected':''}>역방향</option></select></div>`}).join('');return}$('slots').innerHTML=selectedSpread.pos.map((p,i)=>{const x=selected[i];return `<div class="slot ${x?'filled':''}">${x?`<div class="mini-card ${x.rev?'rev':''}">${x.card.name}</div><div class="position">${i+1}. ${p}</div><div class="picked">${x.card.name} · ${x.rev?'역방향':'정방향'}</div>`:`<div class="position">${i+1}. ${p}</div><p>카드를 선택하세요</p>`}</div>`}).join('');}
function update(){if(!selectedSpread){$('counter').textContent='스프레드를 먼저 선택하세요';$('read').disabled=true;return}const n=selectedSpread.pos.length;const count=inputMode==='manual'?manualSelected.filter(Boolean).length:selected.length;if(inputMode==='manual')selected=manualSelected.filter(Boolean);$('counter').textContent=`${count} / ${n}장 ${inputMode==='manual'?'입력':'선택'}`;$('read').disabled=count!==n;}

function questionTheme(q){if(/연애|사랑|상대|관계|재회|결혼/.test(q))return'관계';if(/직장|취업|이직|사업|프로젝트|일/.test(q))return'일';if(/돈|금전|재정|투자|저축|수입/.test(q))return'금전';if(/공부|시험|학업|자격증|합격/.test(q))return'학업';if(/건강|몸|수면|운동/.test(q))return'건강';return'일반'}
function practicalExample(theme){const e={관계:'예: 상대의 마음을 추측하는 대신 “이번 주에 20분 정도 솔직히 이야기할 수 있을까?”라고 구체적으로 물어보세요.',일:'예: 고민 중인 업무를 20분짜리 첫 단계로 쪼개 오늘 초안을 만들고, 필요한 사람 한 명에게 피드백을 요청하세요.',금전:'예: 최근 7일 지출을 고정비·생활비·충동지출로 나눈 뒤 다음 주에 줄일 항목 하나와 금액을 정하세요.',학업:'예: 오늘 25분 타이머를 켜고 한 단원만 공부한 뒤, 틀린 문제 세 개를 오답 노트에 적으세요.',건강:'예: 이번 주 취침 시간을 일정하게 맞추고 10분 걷기처럼 부담이 적은 행동부터 기록하세요. 불편이 지속되면 전문가와 상담하세요.',일반:'예: 미뤄 둔 일을 10분 안에 할 수 있는 첫 행동으로 바꾸고 캘린더에 실행 시간을 넣으세요.'};return e[theme]}
function suitAction(card){if(card.name.includes('완드'))return'생각만 늘리기보다 작은 시도를 먼저 시작하는 편이 좋습니다. 예: 메시지 한 통 보내기, 초안 한 문단 쓰기, 일정 20분 확보하기.';if(card.name.includes('컵'))return'감정을 좋다·싫다로만 판단하지 말고 정확한 이름을 붙여보세요. 예: “서운함 60%, 기대 40%”처럼 메모한 뒤 대화할 내용을 한 문장으로 정리하세요.';if(card.name.includes('소드'))return'사실과 추측을 분리해야 합니다. 종이를 반으로 나눠 확인된 사실 세 가지와 내가 가정한 것 세 가지를 적어보세요.';if(card.name.includes('펜타클'))return'현실 조건을 숫자와 일정으로 확인하세요. 예: 필요한 비용, 가능한 시간, 도움을 구할 사람을 각각 한 줄씩 적으세요.';return'큰 결론보다 지금 통제할 수 있는 선택 하나를 정하세요. 예: 오늘 안에 확인할 정보 한 가지와 미룰 판단 한 가지를 구분하세요.'}
function positionReading(pos,meaning,rev,index){const p=pos.replace(/\s/g,'');let lead;if(/과거|지난/.test(p))lead=`이 자리는 지금의 문제를 만든 배경을 보여줍니다. ${meaning}의 경험이 현재 판단 기준에 남아 있을 가능성이 있습니다.`;else if(/현재|상황|이번달|주차|월$/.test(p))lead=`지금 가장 먼저 다뤄야 할 것은 ${meaning}입니다. 주변 반응보다 현재 사용할 수 있는 시간·정보·자원을 먼저 확인할 때입니다.`;else if(/장애|도전|두려움|숨은|무의식/.test(p))lead=`겉으로 드러난 문제보다 ${meaning}이 실제 걸림돌일 수 있습니다. 반복해서 피하거나 과하게 붙잡는 부분이 무엇인지 확인해 보세요.`;else if(/미래|결과|흐름/.test(p))lead=`현재 방식을 유지하면 ${meaning} 쪽으로 흐를 가능성이 있습니다. 다만 이 카드는 확정된 결말보다 지금 선택의 예상 결과를 보여줍니다.`;else if(/조언|열쇠|행동/.test(p))lead=`이 자리의 핵심 행동은 ${meaning}을 현실적인 기준으로 바꾸는 것입니다. 한 번에 해결하기보다 다음 행동을 작게 정하는 편이 효과적입니다.`;else if(/마음|감정|상대|나의/.test(p))lead=`이 위치에서는 ${meaning}이 감정과 관계의 반응으로 나타납니다. 말로 표현한 내용과 실제 행동 사이에 차이가 있는지 살펴보세요.`;else if(/환경|주변/.test(p))lead=`외부 환경에는 ${meaning}의 영향이 있습니다. 혼자 해결하려 하기보다 일정·규칙·주변 사람의 역할을 조정할 필요가 있습니다.`;else lead=`이 위치는 ${meaning}을 중요한 변수로 보여줍니다. 이것이 실제 생활에서 어떤 선택과 행동으로 나타나는지 확인해 보세요.`;const nuance=rev?' 역방향이므로 부족함만 뜻하기보다, 과도하게 쓰였거나 안으로 눌린 에너지를 조정하라는 의미가 강합니다.':' 정방향이므로 이 에너지를 비교적 직접적으로 활용할 수 있지만, 지나치게 밀어붙이지 않는 균형도 필요합니다.';return lead+nuance}
function handleRead(){const btn=$('read');if(btn.disabled)return;btn.disabled=true;btn.classList.add('button-clicked');btn.textContent='해석 중…';setTimeout(()=>{makeReading();btn.textContent='해석 보기';btn.classList.remove('button-clicked');update();},420)}
function makeReading(){const q=$('question').value.trim()||'지금 나에게 필요한 메시지';const sit=$('situation').value.trim();const theme=questionTheme(q);const items=selected.map((x,i)=>{const meaning=x.rev?x.card.rev:x.card.up;let text=positionReading(selectedSpread.pos[i],meaning,x.rev,i);if(i===0&&sit)text+=` 사용자가 적은 상황에서 핵심 단서는 “${sit}”입니다. 이 문장 안에서 내가 바꿀 수 있는 부분과 상대·환경에 달린 부분을 나눠 보는 것이 좋습니다.`;if(i===selected.length-1)text+=` 이 카드가 말하는 방향을 확인하려면 ${suitAction(x.card)}`;return {position:selectedSpread.pos[i],label:`${x.card.name} · ${x.rev?'역방향':'정방향'}`,meaning,text};});const first=items[0],last=items[items.length-1],middle=items[Math.floor(items.length/2)];let summary;if(items.length===1)summary=`${first.label}은 이번 질문에서 ${first.meaning}을 가장 중요한 기준으로 제시합니다. 지금은 미래를 단정하기보다 이 기준을 실제 선택 한 가지에 적용했을 때 상황이 나아지는지 확인하는 것이 핵심입니다.`;else summary=`이번 리딩은 처음의 ‘${first.meaning.split(',')[0]}’과 마지막의 ‘${last.meaning.split(',')[0]}’ 사이에서 균형점을 찾는 과정입니다. 특히 ${middle.position} 자리의 ${middle.label}이 전환점이므로, 이 부분을 바꾸면 전체 흐름도 달라질 가능성이 큽니다.`;const advice=[practicalExample(theme),suitAction(selected[0].card),`이번 주에는 ‘${middle.position}’와 관련해 확인 가능한 기준을 하나 정하세요. 예: 답장을 기다리는 기한, 사용할 예산, 공부할 시간처럼 측정할 수 있는 기준이면 좋습니다.`,`결정을 내리기 전 “내가 아는 사실 / 내가 추측하는 것 / 지금 확인할 수 있는 것”을 각각 한 줄씩 적어보세요. 불안을 줄이고 다음 행동을 고르는 데 도움이 됩니다.`];if(selected.length>2)advice.push(`마지막 카드인 ${last.label}의 흐름이 부담스럽다면 결과를 피하려 하기보다 오늘 바꿀 수 있는 습관 하나를 정하세요. 작은 수정이 누적되면 흐름도 달라질 수 있습니다.`);$('summary').textContent=summary;$('details').innerHTML=items.map(x=>`<article class="interp"><h3>${x.position} — ${x.label}</h3><p>${x.text}</p></article>`).join('');$('advice').innerHTML=advice.slice(0,5).map(a=>`<li>${a}</li>`).join('');window.readingData={summary,advice:advice.slice(0,5),detailed:items.map(x=>`${x.position} — ${x.label}\n${x.text}`).join('\n\n'),items};$('reading').classList.add('show');$('s4').classList.add('active');$('reading').scrollIntoView({behavior:'smooth'});$('status').className='status';$('status').textContent='GitHub PAT를 입력한 뒤 저장 버튼을 누르면 Action이 실행됩니다.';}

function toBase64(value){const bytes=new TextEncoder().encode(value);let binary='';for(const byte of bytes)binary+=String.fromCharCode(byte);return btoa(binary)}
async function save(){const token=$('githubToken').value.trim();const status=$('status');const button=$('save');if(!token){status.className='status err';status.textContent='GitHub Fine-grained PAT를 입력해 주세요.';return}if(!window.readingData){status.className='status err';status.textContent='먼저 카드 해석을 완성해 주세요.';return}sessionStorage.setItem('githubActionToken',token);const q=$('question').value.trim();const payload={source:'tarot-github-action-v2',title:`${selectedSpread.name} · ${(q||'질문 없는 리딩').slice(0,55)}`,spread:selectedSpread.name,question:q,situation:$('situation').value.trim(),cards:selected.map((x,i)=>`${i+1}. ${selectedSpread.pos[i]}: ${x.card.name} (${x.rev?'역방향':'정방향'})`),summary:window.readingData.summary,advice:window.readingData.advice,detailed:window.readingData.detailed,createdAt:new Date().toISOString()};button.disabled=true;button.textContent='Action 실행 중…';status.className='status';status.textContent='GitHub Action을 실행하고 있습니다.';try{const response=await fetch(`https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/${GITHUB_WORKFLOW}/dispatches`,{method:'POST',headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({ref:'main',inputs:{payload:toBase64(JSON.stringify(payload))}})});if(response.status!==204){let message='';try{message=(await response.json()).message||''}catch{}throw new Error(`${response.status}${message?` · ${message}`:''}`)}status.className='status ok';status.textContent='GitHub Action을 실행했습니다. 잠시 후 타로카드_new에서 확인하세요.'}catch(error){status.className='status err';status.textContent=`Action 실행 실패: ${error.message}. PAT 권한과 workflow 파일을 확인하세요.`}finally{button.disabled=false;button.textContent='GitHub Action으로 저장'}}
$('modeDigital').onclick=()=>setMode('digital');$('modeManual').onclick=()=>setMode('manual');$('reset').onclick=handleReset;$('read').onclick=handleRead;$('save').onclick=save;document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||b.id==='read')return;b.classList.remove('button-clicked');void b.offsetWidth;b.classList.add('button-clicked');setTimeout(()=>b.classList.remove('button-clicked'),180)});renderSpreads();shuffle();$('githubToken').value=sessionStorage.getItem('githubActionToken')||'';
</script></body></html>

<body><main class="app">
<header class="hero"><div class="eyebrow">✦ THE STELLAR ORACLE ✦</div><h1>별빛 타로 리딩</h1><p>스프레드를 고르고, 마음이 닿는 카드 뒷면을 순서대로 선택하세요.</p></header>

<section class="panel"><h2>1. 스프레드 선택</h2><div class="grid" id="spreads"></div></section>
<section class="panel"><h2>2. 질문과 상황</h2><div class="fields"><div><label for="question">질문</label><textarea id="question" placeholder="예: 새로운 일을 시작해도 좋을까요?"></textarea></div><div><label for="situation">현재 상황 (선택)</label><textarea id="situation" placeholder="배경이나 현재 감정을 적으면 해석이 더 구체적이 됩니다."></textarea></div></div></section>
<section class="panel"><div class="toolbar"><h2 style="margin:0">3. 카드 선택</h2><div class="count" id="counter">스프레드를 먼저 선택하세요</div></div><div class="slots" id="slots"><div class="slot">스프레드를 선택하면 카드 자리가 열립니다.</div></div><div class="deck" id="deck"></div><div class="actions" style="margin-top:16px"><button class="btn" id="reset">다시 섞기</button><button class="btn primary" id="read" disabled>해석 보기</button></div></section>
<section class="panel reading" id="reading"><h2>4. 리딩 결과</h2><div class="summary" id="summary"></div><h2 style="margin-top:24px">상세 해석</h2><div class="interpretation" id="details"></div><h2 style="margin-top:24px">현실적인 조언</h2><ul class="advice" id="advice"></ul><div class="savebar"><div><label for="secret">저장 비밀키</label><input id="secret" type="password" autocomplete="off" placeholder="Worker 설정 때 입력한 TAROT_WEBHOOK_KEY"><div class="notice">키는 현재 탭에만 임시 보관되며 HTML 파일에는 저장되지 않습니다.</div></div><button class="btn primary" id="save">타로카드_new에 저장</button></div><div class="status" id="status"></div></section>
</main>

function update(){if(!selectedSpread){$('counter').textContent='스프레드를 먼저 선택하세요';$('read').disabled=true;return}const n=selectedSpread.pos.length;$('counter').textContent=`${selected.length} / ${n}장 선택`;$('read').disabled=selected.length!==n;}
function makeReading(){const q=$('question').value.trim()||'지금 나에게 필요한 메시지';const sit=$('situation').value.trim();const items=selected.map((x,i)=>{const meaning=x.rev?x.card.rev:x.card.up;const tone=x.rev?'에너지가 안으로 향하거나 조정이 필요한 모습':'에너지가 자연스럽게 드러나는 모습';return {position:selectedSpread.pos[i],label:`${x.card.name} · ${x.rev?'역방향':'정방향'}`,meaning,text:`‘${selectedSpread.pos[i]}’ 자리의 ${x.card.name}은(는) ${meaning}을 비춥니다. ${tone}으로, “${q}”에 대해서는 서둘러 결론을 확정하기보다 이 상징이 현실에서 어디에 나타나는지 살펴보라는 메시지입니다.${sit?` 현재 상황인 “${sit}”과 연결하면, 작은 신호와 반복되는 감정을 관찰하는 것이 중요합니다.`:''}`};});const first=items[0],last=items[items.length-1];const summary=`이번 ${selectedSpread.name} 리딩의 중심은 ${first.meaning}에서 출발해 ${last.meaning}으로 이어지는 흐름입니다. 정해진 운명이라기보다, 현재의 선택과 태도에 따라 더 균형 있는 방향으로 움직일 수 있음을 보여줍니다.`;const advice=[`가장 먼저 ‘${first.position}’의 메시지인 ${first.meaning.split(',')[0]}을 일상에서 한 가지 행동으로 옮겨보세요.`,`결정이 필요하다면 감정과 사실을 분리해 적고, 24시간 뒤 다시 확인하세요.`,`‘${last.position}’ 카드가 보여주는 ${last.meaning.split(',')[0]}을 목표가 아닌 방향표로 활용하세요.`,`큰 변화보다 오늘 반복할 수 있는 작은 선택 하나를 정하세요.`];$('summary').textContent=summary;$('details').innerHTML=items.map(x=>`<article class="interp"><h3>${x.position} — ${x.label}</h3><p>${x.text}</p></article>`).join('');$('advice').innerHTML=advice.map(a=>`<li>${a}</li>`).join('');window.readingData={summary,advice,detailed:items.map(x=>`${x.position} — ${x.label}\n${x.text}`).join('\n\n'),items};$('reading').classList.add('show');$('s4').classList.add('active');$('reading').scrollIntoView({behavior:'smooth'});if($('secret').value.trim()){setTimeout(save,250)}else{$('status').className='status';$('status').textContent='저장 비밀키를 입력하면 이번 리딩이 자동 저장됩니다.';}}
async function save(){const key=$('secret').value.trim();const status=$('status');if(!key){status.className='status err';status.textContent='저장 비밀키를 입력해 주세요.';return}sessionStorage.setItem('tarotKey',key);const q=$('question').value.trim();const payload={source:'tarot-oracle-v1',title:`${selectedSpread.name} · ${(q||'질문 없는 리딩').slice(0,55)}`,spread:selectedSpread.name,question:q,situation:$('situation').value.trim(),cards:selected.map((x,i)=>`${i+1}. ${selectedSpread.pos[i]}: ${x.card.name} (${x.rev?'역방향':'정방향'})`),summary:window.readingData.summary,advice:window.readingData.advice,detailed:window.readingData.detailed,createdAt:new Date().toISOString()};status.className='status';status.textContent='저장 요청을 보내는 중…';try{let frame=document.getElementById('saveTarget');if(!frame){frame=document.createElement('iframe');frame.id='saveTarget';frame.name='saveTarget';frame.className='hidden';document.body.appendChild(frame)}const form=document.createElement('form');form.method='POST';form.action=`${WEBHOOK}?key=${encodeURIComponent(key)}`;form.target='saveTarget';form.className='hidden';const field=document.createElement('input');field.name='payload';field.value=JSON.stringify(payload);form.appendChild(field);document.body.appendChild(form);form.submit();form.remove();status.className='status ok';status.textContent='저장 요청을 전송했습니다. 잠시 후 타로카드_new에서 확인하세요.';}catch(e){status.className='status err';status.textContent='저장 전송에 실패했습니다. HTML 파일을 Chrome 또는 Edge에서 직접 열었는지 확인하세요.';}}
$('reset').onclick=shuffle;$('read').onclick=makeReading;$('save').onclick=save;$('secret').addEventListener('change',()=>{if(window.readingData&&$('secret').value.trim())save()});renderSpreads();shuffle();$('secret').value=sessionStorage.getItem('tarotKey')||'';
</script></body></html>
